spring:
  application:
    name: gargantua-control-plane

  # Durable by default with zero infrastructure: an embedded H2 in file mode.
  # Activate the `postgres` profile to point the same JDBC document store at
  # Cave's Postgres instead (see application-postgres.yml).
  datasource:
    url: jdbc:h2:file:./data/db/controlplane;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always   # runs schema.sql (CREATE TABLE IF NOT EXISTS) on every boot

server:
  port: 8080

# Launch command template for starting runtime containers (used by RuntimeLauncher).
gargantua:
  security:
    # Bearer tokens for the API, comma-separated. Leave both empty and the API is open (a
    # warning is logged at startup) — fine on a laptop, not on anything shared.
    #   admin  — may read and change state (publish, promote, delete, register, deploy)
    #   reader — may only read; enough for a Runtime to download its bundle
    # Supply them from the environment, never commit them:
    #   GARGANTUA_SECURITY_ADMIN_TOKENS, GARGANTUA_SECURITY_READER_TOKENS
    admin-tokens: ${GARGANTUA_SECURITY_ADMIN_TOKENS:}
    reader-tokens: ${GARGANTUA_SECURITY_READER_TOKENS:}
  launch:
    # Whether this Control Plane exposes POST /api/v1/deployments/{id}/launch and runs the
    # command below itself. Off by default: the Control Plane records desired state and an
    # executor applies it (ADR-004) — Studio, in the reference stack. Turn it on only where
    # nothing else can launch, and only on a host you are willing to let run this command.
    enabled: false
    # The command Control Plane runs to start a published agent. {name}/{version} are substituted
    # (validated against ^[A-Za-z0-9._-]+$ first). Generic on purpose: swap for kubectl etc.
    # without a code change. Editable at runtime via deployment configuration.
    command-template: >-
      docker rm -f gargantua-runtime-{name} 2>/dev/null;
      docker run -d --name gargantua-runtime-{name} --network gargantua_default -p 18100:8080
      -e GARGANTUA_BUNDLE_URL=http://control-plane:8080/api/v1/registry/bundles/{name}/{version}/bundle
      -e SPRING_PROFILES_ACTIVE=embedded,cave
      gargantua-runtime:local
    # Working directory the command runs in (unused by the docker-run default).
    workdir: .
    # How long the command may run before the deployment is marked FAILED.
    timeout-seconds: 300

# Expose health/info so the platform can readiness-check the Control Plane.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
